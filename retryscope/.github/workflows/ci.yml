name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore RetryScope.slnx --locked-mode
      - name: Build
        run: dotnet build RetryScope.slnx --no-restore -c Release
      - name: Test
        run: dotnet test --solution RetryScope.slnx --no-build -c Release
